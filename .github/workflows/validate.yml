name: Validate Tools & Schema

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Tool Structure & Metadata
        run: |
          python scripts/validate_tools.py

      - name: Generate Directory
        run: |
          python scripts/generate_directory.py
